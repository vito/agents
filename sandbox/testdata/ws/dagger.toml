# Throwaway test workspace for the sandbox module: exercises exec's
# Container!-typed sandbox arg, which resolves addresses at the CALLER's
# boundary (workspace mode), so sibling module refs work.
#
# `sidecar` is the sibling: a zero-arg Container-returning function
# (dag://sidecar/ctr) installed in THIS workspace's config. Exercise it via
# `dagger --workdir sandbox/testdata/ws call sandbox exec
# --sandbox dag://sidecar/ctr ...` from the repo root; `dagger list` (or
# FindArtifacts(type: "Container") in an agent) discovers it. The
# agents-dev sandbox-siblings check runs it too.

[modules.sidecar]
source = ".dagger/modules/sidecar"

# A byte-identical COPY of sandbox/main.dang (module sources cannot point
# outside the workspace root). Installed by name so `dagger call sandbox ...`
# runs in workspace mode, where CLI object flags resolve DAG addresses. Keep
# in sync when the real module changes; the sandbox-siblings check fails
# otherwise.
[modules.sandbox]
source = ".dagger/modules/sandbox"
